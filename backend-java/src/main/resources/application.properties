# Server port
server.port=5000

# JWT
jwt.secret=${JWT_SECRET:supersecretjwtkey_smartfarmer_secure_token}
jwt.expiration=360000000

# Gemini API
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# Request size limits (for image uploads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
